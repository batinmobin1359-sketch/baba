
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه ورود</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #4c1d95);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 35px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
    }

    h2 {
      text-align: center;
      color: #1e1b4b;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px #ede9fe;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 25px;
      gap: 10px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .remember input {
      width: auto;
    }

    a {
      color: #7c3aed;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #6d28d9;
      transform: translateY(-2px);
    }

    .signup {
      text-align: center;
      margin-top: 25px;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 450px) {
      .login-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2>خوش آمدید!</h2>
    <p class="subtitle">
      برای ورود به حساب خود اطلاعات را وارد کنید
    </p>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">ایمیل</label>
        <input
          type="email"
          id="email"
          placeholder="example@email.com"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">رمز عبور</label>
        <input
          type="password"
          id="password"
          placeholder="رمز عبور خود را وارد کنید"
          required
          minlength="8"
        >
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember">
          مرا به خاطر بسپار
        </label>

        <a href="forgot-password.html">فراموشی رمز؟</a>
      </div>

      <button type="submit">ورود به حساب</button>
    </form>

    <p class="signup">
      حساب ندارید؟
      <a href="register.html">ثبت‌نام کنید</a>
    </p>
  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        alert("ظاهر صفحه آماده است؛ برای ورود واقعی باید بک‌اند متصل شود.");
      });
  </script>
</body>
</html>
